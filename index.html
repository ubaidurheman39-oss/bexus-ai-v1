    <script>
      // Bulletproof console sanitizer: mocks WebSocket to prevent Vite HMR reconnection errors,
      // and eliminates all info bubbles (i), warnings (!), and noisy errors (X) in browser DevTools.
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Mock WebSocket for Vite so it never fails or retries connection
        try {
          const OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('localhost') || url.includes('.run.app') || url.includes('ai.studio') || url.includes('vite') || url.includes('ws'))) {
              return {
                readyState: 3, // CLOSED
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
            }
            return new OrigWS(url, protocols);
          };
          if (OrigWS) {
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch(e) {}

        // 2. Completely eliminate console.info and console.debug (clears blue (i) badge)
        console.info = function() {};
        console.debug = function() {};

        // 3. Filter out noisy warnings (clears orange (!) badge)
        const origWarn = console.warn;
        console.warn = function(...args) {
          const msg = (args[0] && typeof args[0] === 'string') ? args[0] : '';
          if (
            msg.includes('WebSocket') || 
            msg.includes('vite') || 
            msg.includes('React DevTools') ||
            msg.includes('AudioContext') ||
            msg.includes('polling') ||
            msg.includes('favicon')
          ) return;
          origWarn.apply(console, args);
        };

        // 4. Filter out noisy connection errors (clears red (X) badge)
        const origError = console.error;
        console.error = function(...args) {
          const msg = (args[0] && typeof args[0] === 'string') ? args[0] : '';
          if (
            msg.includes('WebSocket') || 
            msg.includes('vite') || 
            msg.includes('polling') ||
            msg.includes('favicon')
          ) return;
          origError.apply(console, args);
        };

        // 5. Suppress unhandled error events
        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('favicon'))) ||
            (e.target && e.target.nodeName === 'SCRIPT' && e.target.src && e.target.src.includes('vite'))
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
